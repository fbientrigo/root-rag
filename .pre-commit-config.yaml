# Pre-commit hooks for root-rag.
# Install once with:  pip install pre-commit && pre-commit install
# Run on all files:   pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        name: ruff (lint, autofix)
        args: [--fix]
      - id: ruff-format
        name: ruff (format)
